[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.2.0"
description = "ربات ترید طلا — بک‌تست، معامله کاغذی و پنل وب"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.25"]

[project.scripts]
trading-bot = "trading_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trading_bot.web" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
