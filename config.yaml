# ============================================================
#  فایل تنظیمات ربات ترید طلا
#  هر چیزی که می‌خواهی تغییر بدهی، اینجاست. کد را دست نزن.
#
#  تغییراتی که از پنل وب ذخیره می‌کنی در data/panel_settings.json
#  می‌نشیند و روی این فایل اولویت دارد. این فایل دست نمی‌خورد.
# ============================================================

market:
  # نماد طلا. XAUUSD یعنی «یک اونس طلا به دلار» و هر منبع داده خودش آن را
  # به نماد درست ترجمه می‌کند:
  #   nobitex / binance → PAXGUSDT  (توکن پکس‌گلد؛ هر توکن = یک اونس طلای واقعی)
  #   yahoo             → GC=F      (قرارداد آتی طلا در بورس نیویورک)
  # نمادهای دیگر: PAXGUSDT، PAXGIRT (پکس‌گلد به تومان در نوبیتکس)، XAUTUSDT
  symbol: XAUUSD
  timeframe: 4h          # تایم‌فریم کندل‌ها: 1h / 4h / 1d  (برای شروع 4h بهترین است)
  # منبع داده: auto | nobitex | binance | yahoo | sample
  #   auto   = به ترتیب nobitex ← binance ← yahoo را امتحان می‌کند و اولی که جواب داد
  #   sample = داده مصنوعی، بدون اینترنت (فقط برای آشنایی)
  source: auto

strategy:
  # ema_trend         = دنبال کردن روند با میانگین متحرک (پیشنهاد برای شروع)
  # donchian_breakout = خرید در شکست سقف (سبک «لاک‌پشت‌ها»)
  # rsi_pullback      = خرید در اصلاح قیمت، وسط روند صعودی
  name: ema_trend
  params:
    ema_fast: 12         # میانگین متحرک سریع
    ema_slow: 26         # میانگین متحرک کند
    ema_trend: 200       # فیلتر روند بلندمدت (فقط در روند صعودی می‌خریم)
    atr_period: 14       # دوره ATR برای محاسبه نوسان
    atr_stop_mult: 2.5   # حد ضرر = قیمت ورود - (2.5 × ATR)
    atr_target_mult: 5.0 # حد سود  = قیمت ورود + (5.0 × ATR)

risk:
  initial_capital: 1000.0   # سرمایه اولیه (دلاری/تتری)
  risk_per_trade: 0.01      # در هر معامله حداکثر ۱٪ سرمایه ریسک می‌کنیم
  max_position_pct: 0.95    # حداکثر ۹۵٪ سرمایه در یک پوزیشن
  max_drawdown_stop: 0.25   # اگر ۲۵٪ افت سرمایه داشتیم، ربات متوقف می‌شود

costs:
  # کارمزد هر طرف معامله. کارمزد صرافی خودت را چک کن و اینجا بگذار.
  # بهتر است کمی بدبینانه باشی: کارمزدِ کم‌تر از واقعیت، بک‌تست را دروغگو می‌کند.
  fee_rate: 0.002        # ۰.۲٪
  slippage_rate: 0.0005  # لغزش قیمت (اختلاف قیمت انتظاری و واقعی): ۰.۰۵٪

live:
  mode: paper            # paper = معامله با پول تقلبی | real = هنوز پیاده‌سازی نشده (عمدی)
  poll_seconds: 60       # هر چند ثانیه قیمت را چک کند
  state_file: data/paper_state.json

panel:
  # 127.0.0.1 = فقط از داخل خود سرور (امن‌ترین؛ با تونل SSH وصل شو)
  # 0.0.0.0   = از همه‌جا (فقط پشت nginx + HTTPS یا با فایروال)
  # می‌توانی با متغیر PANEL_HOST / PANEL_PORT در فایل .env هم عوضش کنی.
  host: 127.0.0.1
  port: 8000
  settings_file: data/panel_settings.json
