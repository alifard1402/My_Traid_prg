# ============================================================
#  فایل تنظیمات ربات ترید
#  هر چیزی که می‌خواهی تغییر بدهی، اینجاست. کد را دست نزن.
# ============================================================

market:
  symbol: BTCUSDT        # جفت‌ارز معاملاتی
  timeframe: 4h          # تایم‌فریم کندل‌ها: 1h / 4h / 1d
  source: sample         # منبع داده: sample | nobitex | binance

strategy:
  name: ema_trend
  params:
    ema_fast: 12         # میانگین متحرک سریع
    ema_slow: 26         # میانگین متحرک کند
    ema_trend: 200       # فیلتر روند بلندمدت (فقط در روند صعودی می‌خریم)
    atr_period: 14       # دوره ATR برای محاسبه نوسان
    atr_stop_mult: 2.5   # حد ضرر = قیمت ورود - (2.5 × ATR)
    atr_target_mult: 5.0 # حد سود  = قیمت ورود + (5.0 × ATR)

risk:
  initial_capital: 1000.0   # سرمایه اولیه (دلاری/تتری)
  risk_per_trade: 0.01      # در هر معامله حداکثر ۱٪ سرمایه ریسک می‌کنیم
  max_position_pct: 0.95    # حداکثر ۹۵٪ سرمایه در یک پوزیشن
  max_drawdown_stop: 0.25   # اگر ۲۵٪ افت سرمایه داشتیم، ربات متوقف می‌شود

costs:
  fee_rate: 0.001        # کارمزد هر طرف معامله: ۰.۱٪
  slippage_rate: 0.0005  # لغزش قیمت (اختلاف قیمت انتظاری و واقعی): ۰.۰۵٪

live:
  mode: paper            # paper = معامله با پول تقلبی | real = هنوز پیاده‌سازی نشده (عمدی)
  poll_seconds: 60       # هر چند ثانیه قیمت را چک کند
  state_file: data/paper_state.json
