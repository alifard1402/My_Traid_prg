# ============================================================
#  اختیاری: دسترسی به پنل از اینترنت با دامنه و HTTPS
#  (اگر دامنه نداری، از تونل SSH استفاده کن؛ امن‌تر و ساده‌تر است.)
#
#  ۱. رکورد A دامنه‌ات (مثلاً bot.example.com) را به IP سرور بزن
#  ۲. sudo apt install -y nginx certbot python3-certbot-nginx
#  ۳. این فایل را کپی کن و example.com را با دامنه خودت عوض کن:
#       sudo cp deploy/nginx-goldbot.conf /etc/nginx/sites-available/goldbot
#       sudo nano /etc/nginx/sites-available/goldbot
#       sudo ln -s /etc/nginx/sites-available/goldbot /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#  ۴. گواهی HTTPS رایگان:
#       sudo certbot --nginx -d bot.example.com
#  ۵. فایروال:
#       sudo ufw allow OpenSSH && sudo ufw allow 'Nginx Full' && sudo ufw enable
#
#  پنل همچنان روی 127.0.0.1:8000 می‌ماند و فقط nginx به آن وصل می‌شود.
# ============================================================
server {
    listen 80;
    server_name bot.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # بک‌تست روی داده زیاد ممکن است چند ثانیه طول بکشد
    }
}
